name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signlaw
          POSTGRES_PASSWORD: signlaw
          POSTGRES_DB: signlaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signlaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: mypy (strict)
        run: mypy app

      - name: Unit and e2e tests
        run: pytest tests/unit tests/e2e --cov=app --cov-report=xml --cov-report=term-missing

      - name: Verify migrations apply cleanly
        env:
          DB__HOST: localhost
          DB__PORT: "5432"
          DB__USER: signlaw
          DB__PASSWORD: signlaw
          DB__NAME: signlaw_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Detect model/migration drift
        env:
          DB__HOST: localhost
          DB__PORT: "5432"
          DB__USER: signlaw
          DB__PASSWORD: signlaw
          DB__NAME: signlaw_test
        run: alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
